name: voice-navigation-ci

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - 'navigation/**'
      - '.github/workflows/voice-navigation-ci.yml'
  pull_request:
    paths:
      - 'voice/**'
      - 'navigation/**'
      - '.github/workflows/voice-navigation-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m py_compile             voice/v4/native_speech_v4.py             voice/v4/voicecore_v4.py             voice/v4/test_native_speech_v4.py             voice/v4/test_voicecore_v4.py             voice/uefi_units/build_native_units.py             navigation/uefi/generate_units.py             navigation/uefi/test_m1603qa_308_baseline.py

      - name: Run VoiceCore v4 tests
        working-directory: voice/v4
        run: |
          set -euo pipefail
          python test_native_speech_v4.py
          python test_voicecore_v4.py

      - name: Generate UEFI navigation speech units
        run: |
          set -euo pipefail
          mkdir -p build
          (cd navigation/uefi && python test_generate_units.py)
          (cd navigation/uefi && python test_navigation_source_contract.py)
          (cd navigation/uefi && python test_m1603qa_308_baseline.py)
          (cd navigation/uefi && python test_m1603qa_308_baseline.py)
          python navigation/uefi/generate_units.py build/navigation_units.c build/navigation_units.txt
          grep -F 'source=voice/uefi_units/build_native_units.py' build/navigation_units.txt
          grep -F 'speech-mode=clear-lettername-spelling-fr-v3' build/navigation_units.txt
          grep -F 'letter-map=a-z-french-letter-names' build/navigation_units.txt
          grep -F 'digit-map=0-9-french-number-names' build/navigation_units.txt

      - name: Compile UEFI navigation engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          flags='--target=x86_64-pc-windows-msvc -DQEV_INTERACTIVE_NAV=1 -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c navigation/uefi/hii_graph_prompt_speech_uefi.c -o build/navigation.obj
          clang $flags -c build/navigation_units.c -o build/navigation_units.obj
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:build/NAVIGATION.EFI build/navigation.obj build/navigation_units.obj
          test -s build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_REALTIME_MODE=INTERRUPTIBLE_DMA' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_REALTIME_FOCUS_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SEMANTIC_ROLE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONTEXT_HELP_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_DIRECTIONAL_ALIASES=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_TAB_FORWARD=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SPEECH_INTERRUPT=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CHECKBOX_STATE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONDITION_EVALUATOR=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SUPPRESS_RUNTIME=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_GRAY_RUNTIME=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_DISABLE_RUNTIME=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONDITION_UNKNOWN_SAFE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_STRUCTURAL_KEYS=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_FORM_KEYS=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_FORM_ID_TRACKING=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_QUESTION_ID_TRACKING=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_VARSTORE_METADATA=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_VARSTORE_CATALOG=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_ONEOF_OPTIONS=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_LIVE_OPTION_MATCH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_LIVE_VALUE_KEY=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_LIVE_VALUE_READ=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_FOCUS_VALUE_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_INITIAL_VALUE_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SEMANTIC_SPEECH=ROLE_STATE_LABEL_VALUE' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_PROFILE=M1603QA_BIOS_308' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_PACKAGE_GUID_MATCH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_ROOT_FORM_2710=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_FORM_AWARE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_FORM_ENTER=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_READ_ONLY_ACTION=BLOCKED' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_DISABLED_ACTION=BLOCKED' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONDITIONAL_ACTION=BLOCKED' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONDITION_TRACKING=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_FORM_ID=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_QUESTION_ID=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_HANDLE_INDEX=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_VALUE_WIDTH=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_VARSTORE_ID=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_VAR_INFO=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_QUESTION_FLAGS=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONDITION_FLAGS=0x' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_DIGITS=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_WHERE_AM_I_KEY=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_POSITION_KEY=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_POSITION_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_LIVE_REFRESH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_REFRESH_FOCUS_RESTORED=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_REFRESH_FOCUS_FALLBACK=PASS' build/NAVIGATION.EFI
          echo VOICE_NAVIGATION_BUILD=PASS

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-navigation-build
          path: |
            build/NAVIGATION.EFI
            build/navigation_units.txt
          if-no-files-found: error
